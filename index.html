<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tetris Game</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:flex; justify-content:center; align-items:center;
  background:#111827; color:white; font-family:Arial,sans-serif;
}
.game{display:flex;gap:24px;align-items:flex-start}
canvas{background:#020617;border:4px solid #374151;border-radius:8px}
.panel{
  width:190px;background:#1f2937;padding:20px;border-radius:12px;text-align:center;
}
h1{margin:0 0 18px;font-size:30px}
.info{font-size:18px;margin:10px 0}
button{
  width:100%;padding:11px;margin-top:10px;border:0;border-radius:7px;
  background:#2563eb;color:white;font-size:16px;cursor:pointer
}
button:hover{background:#1d4ed8}
.controls{margin-top:20px;font-size:13px;line-height:1.8;color:#d1d5db}
@media(max-width:600px){.game{flex-direction:column;align-items:center}.panel{width:300px}}
</style>
</head>
<body>

<div class="game">
  <canvas id="game" width="300" height="600"></canvas>

  <div class="panel">
    <h1>TETRIS</h1>
    <div class="info">Score: <b id="score">0</b></div>
    <div class="info">Lines: <b id="lines">0</b></div>
    <div class="info">Level: <b id="level">1</b></div>
    <button onclick="startGame()">Start / Restart</button>
    <button onclick="togglePause()">Pause</button>

    <div class="controls">
      <b>Controls</b><br>
      ← → Move<br>
      ↓ Soft Drop<br>
      ↑ Rotate<br>
      Space Hard Drop<br>
      P Pause
    </div>
  </div>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const COLS=10, ROWS=20, SIZE=30;

const colors=[
  null,"#00e5ff","#4169e1","#ff8c00","#ffd700",
  "#32cd32","#9932cc","#ff3030"
];

const shapes=[
  [[1,1,1,1]],
  [[2,0,0],[2,2,2]],
  [[0,0,3],[3,3,3]],
  [[4,4],[4,4]],
  [[0,5,5],[5,5,0]],
  [[0,6,0],[6,6,6]],
  [[7,7,0],[0,7,7]]
];

let board, player, score=0, lines=0, level=1;
let running=false, paused=false, dropTimer=0, lastTime=0;
let dropInterval=800;

function newBoard(){
  return Array.from({length:ROWS},()=>Array(COLS).fill(0));
}

function newPiece(){
  const shape=shapes[Math.floor(Math.random()*shapes.length)];
  return {
    matrix:shape.map(row=>[...row]),
    x:Math.floor(COLS/2)-2,
    y:0
  };
}

function drawCell(x,y,color){
  ctx.fillStyle=color;
  ctx.fillRect(x*SIZE,y*SIZE,SIZE,SIZE);
  ctx.strokeStyle="#111827";
  ctx.strokeRect(x*SIZE,y*SIZE,SIZE,SIZE);
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  for(let y=0;y<ROWS;y++)
    for(let x=0;x<COLS;x++)
      if(board[y][x]) drawCell(x,y,colors[board[y][x]]);

  player.matrix.forEach((row,y)=>{
    row.forEach((value,x)=>{
      if(value) drawCell(player.x+x,player.y+y,colors[value]);
    });
  });

  if(paused && running){
    ctx.fillStyle="rgba(0,0,0,.65)";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle="white";
    ctx.font="bold 36px Arial";
    ctx.textAlign="center";
    ctx.fillText("PAUSED",canvas.width/2,canvas.height/2);
  }
}

function collision(){
  for(let y=0;y<player.matrix.length;y++){
    for(let x=0;x<player.matrix[y].length;x++){
      if(!player.matrix[y][x]) continue;
      const bx=player.x+x, by=player.y+y;
      if(bx<0 || bx>=COLS || by>=ROWS) return true;
      if(by>=0 && board[by][bx]) return true;
    }
  }
  return false;
}

function merge(){
  player.matrix.forEach((row,y)=>{
    row.forEach((value,x)=>{
      if(value && player.y+y>=0)
        board[player.y+y][player.x+x]=value;
    });
  });
}

function move(dir){
  player.x+=dir;
  if(collision()) player.x-=dir;
}

function rotateMatrix(matrix){
  return matrix[0].map((_,i)=>matrix.map(row=>row[i]).reverse());
}

function rotate(){
  const old=player.matrix;
  const oldX=player.x;
  player.matrix=rotateMatrix(player.matrix);

  let offset=1;
  while(collision()){
    player.x+=offset;
    offset=-(offset+(offset>0?1:-1));
    if(Math.abs(offset)>player.matrix[0].length){
      player.matrix=old;
      player.x=oldX;
      return;
    }
  }
}

function drop(){
  player.y++;
  if(collision()){
    player.y--;
    merge();
    clearLines();
    player=newPiece();
    if(collision()) endGame();
  }
  dropTimer=0;
}

function hardDrop(){
  while(!collision()) player.y++;
  player.y--;
  merge();
  clearLines();
  player=newPiece();
  if(collision()) endGame();
  dropTimer=0;
}

function clearLines(){
  let count=0;

  for(let y=ROWS-1;y>=0;y--){
    if(board[y].every(cell=>cell!==0)){
      board.splice(y,1);
      board.unshift(Array(COLS).fill(0));
      count++;
      y++;
    }
  }

  if(count){
    const points=[0,100,300,500,800];
    score+=points[count]*level;
    lines+=count;
    level=Math.floor(lines/10)+1;
    dropInterval=Math.max(100,800-(level-1)*70);
    updateInfo();
  }
}

function updateInfo(){
  document.getElementById("score").textContent=score;
  document.getElementById("lines").textContent=lines;
  document.getElementById("level").textContent=level;
}

function startGame(){
  board=newBoard();
  player=newPiece();
  score=0; lines=0; level=1;
  dropInterval=800;
  dropTimer=0;
  running=true;
  paused=false;
  updateInfo();
  lastTime=performance.now();
  requestAnimationFrame(loop);
}

function togglePause(){
  if(running) paused=!paused;
}

function endGame(){
  running=false;
  draw();
  setTimeout(()=>alert("Game Over! Score: "+score),100);
}

function loop(time){
  if(!running) return;

  const delta=time-lastTime;
  lastTime=time;

  if(!paused){
    dropTimer+=delta;
    if(dropTimer>dropInterval) drop();
    draw();
  }else{
    draw();
  }

  requestAnimationFrame(loop);
}

document.addEventListener("keydown",e=>{
  if(!running || paused) return;

  if(e.key==="ArrowLeft") move(-1);
  else if(e.key==="ArrowRight") move(1);
  else if(e.key==="ArrowDown") drop();
  else if(e.key==="ArrowUp") rotate();
  else if(e.code==="Space"){
    e.preventDefault();
    hardDrop();
  }
  else if(e.key.toLowerCase()==="p") togglePause();

  draw();
});
</script>

</body>
</html>
